<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  {% include "partials/theme_init.html" %}
  <title>{{ page_title }} • Skairova</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css', v='20260527-ios-input-zoom') }}" />
  <link rel="stylesheet" href="{{ url_for('static', filename='coming-soon.css', v='20260513-descender-fix') }}" />
  {% include "partials/theme_head.html" %}
</head>
<body class="coming-soon-page">
  {% include "partials/platform_header.html" %}

  <main class="coming-soon-shell" aria-labelledby="errorPageTitle">
    <section class="coming-soon-card">
      <div class="coming-soon-orb coming-soon-orb--one" aria-hidden="true"></div>
      <div class="coming-soon-orb coming-soon-orb--two" aria-hidden="true"></div>
      <div class="coming-soon-grid" aria-hidden="true"></div>

      <p class="coming-soon-kicker">{{ kicker }}</p>
      <h1 id="errorPageTitle">
        <span>{{ heading_line1 }}</span>
        <strong>{{ heading_line2 }}</strong>
      </h1>
      <p class="coming-soon-copy">{{ description }}</p>

      <div class="coming-soon-actions">
        <a href="{{ url_for('index') }}">Search flights</a>
        <span>{{ footer_note }}</span>
      </div>
    </section>
  </main>
</body>
</html>
