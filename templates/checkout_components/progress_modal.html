<div class="bpm" hidden data-progress-modal aria-modal="true" role="dialog" aria-label="Booking in progress">
  <div class="bpm-card">

    <!-- Top progress bar -->
    <div class="bpm-track" aria-hidden="true">
      <div class="bpm-fill" id="bpmFill"></div>
    </div>

    <!-- Orbital spinner centerpiece -->
    <div class="bpm-orb" aria-hidden="true">
      <div class="bpm-ring bpm-ring--a"></div>
      <div class="bpm-ring bpm-ring--b"></div>
      <div class="bpm-ring bpm-ring--c"></div>
      <div class="bpm-glow"></div>
      <div class="bpm-core">
        <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
          <path d="M21 16v-2l-8-5V3.5C13 2.67 12.33 2 11.5 2S10 2.67 10 3.5V9l-8 5v2l8-2.5V19l-2 1.5V22l3.5-1 3.5 1v-1.5L13 19v-5.5l8 2.5z"/>
        </svg>
      </div>
    </div>

    <!-- Heading -->
    <div class="bpm-eyebrow">Booking in progress</div>
    <div class="bpm-title" id="bpmTitle">Securing your trip</div>

    <!-- Steps -->
    <ol class="bpm-steps" id="bpmSteps">
      <li class="bpm-step" data-step="0">
        <span class="bpm-step-icon" aria-hidden="true">
          <svg class="bpm-check" viewBox="0 0 12 12" fill="none"><polyline points="2,6 5,9 10,3" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </span>
        <span class="bpm-step-label">Validating traveler details</span>
      </li>
      <li class="bpm-step" data-step="1">
        <span class="bpm-step-icon" aria-hidden="true">
          <svg class="bpm-check" viewBox="0 0 12 12" fill="none"><polyline points="2,6 5,9 10,3" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </span>
        <span class="bpm-step-label">Confirming airline offer</span>
      </li>
      <li class="bpm-step" data-step="2">
        <span class="bpm-step-icon" aria-hidden="true">
          <svg class="bpm-check" viewBox="0 0 12 12" fill="none"><polyline points="2,6 5,9 10,3" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </span>
        <span class="bpm-step-label">Authenticating payment</span>
      </li>
      <li class="bpm-step" data-step="3">
        <span class="bpm-step-icon" aria-hidden="true">
          <svg class="bpm-check" viewBox="0 0 12 12" fill="none"><polyline points="2,6 5,9 10,3" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </span>
        <span class="bpm-step-label">Creating your order</span>
      </li>
      <li class="bpm-step" data-step="4">
        <span class="bpm-step-icon" aria-hidden="true">
          <svg class="bpm-check" viewBox="0 0 12 12" fill="none"><polyline points="2,6 5,9 10,3" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </span>
        <span class="bpm-step-label">Finalizing booking</span>
      </li>
    </ol>

  </div>
</div>
