<script>
(function(){try{
  // Dark mode is temporarily disabled. Keep the saved preference untouched so
  // the switch can be restored later without migrating visitor settings.
  document.documentElement.setAttribute("data-theme","light");
  var m=document.querySelector('meta[name="theme-color"]');
  if(!m){m=document.createElement("meta");m.setAttribute("name","theme-color");document.head.appendChild(m);}
  m.setAttribute("content","#eef2f7");
}catch(e){}})();
</script>
