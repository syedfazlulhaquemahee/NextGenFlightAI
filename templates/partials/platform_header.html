<header class="topbar platform-header">
  <div class="brand platform-header-inner">
    <a class="brand-link" href="{{ url_for('index') }}">SKAIROVA</a>
    <nav class="site-nav" aria-label="Main navigation">
      {% set hotel_endpoints = ['hotels', 'hotel_search', 'hotel_ai_search', 'hotel_detail'] %}
      <a class="site-nav-link {{ 'site-nav-active' if request.endpoint not in hotel_endpoints + ['deals'] else '' }}" href="{{ url_for('index') }}">Flights</a>
      <a class="site-nav-link {{ 'site-nav-active' if request.endpoint in hotel_endpoints else '' }}" href="{{ url_for('hotels') }}">Hotels</a>
      <a class="site-nav-link {{ 'site-nav-active' if request.endpoint == 'deals' else '' }}" href="{{ url_for('deals') }}">Deals</a>
    </nav>
    <div class="topbar-utility">
      <div class="topbar-links">
        {% include "partials/user_portal_link.html" %}
      </div>
    </div>
  </div>
</header>
