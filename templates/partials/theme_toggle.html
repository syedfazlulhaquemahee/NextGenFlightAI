{# Dark mode is temporarily disabled. Preserve this markup so the toggle can be restored later. #}
{% if false %}
<div class="theme-toggle-slot">
  <button
    type="button"
    class="theme-switch"
    id="themeToggle"
    role="switch"
    aria-checked="false"
    aria-label="Toggle theme"
    title="Use light theme"
  >
    <span class="theme-switch-track" aria-hidden="true">
      <span class="theme-switch-thumb"></span>
      <span class="theme-switch-icons">
        <span class="theme-switch-icon theme-switch-icon--dark" aria-hidden="true">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
        </span>
        <span class="theme-switch-icon theme-switch-icon--light" aria-hidden="true">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/></svg>
        </span>
      </span>
    </span>
  </button>
</div>
{% endif %}
